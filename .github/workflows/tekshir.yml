name: План-факт текшируви

on:
  schedule:
    - cron: "0 6 * * 1-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = синов (ёзмайди), 0 = ҳақиқий юбориш"
        default: "1"
      plan_oy:
        description: "Қайси ой плани (масалан 2026-10). Бўш = жорий ой"
        default: ""

concurrency:
  group: plan-fakt
  cancel-in-progress: false

jobs:
  tekshir:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install telethon==1.36.0 gspread==6.1.2
      - run: python tekshir.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: 1VQekH3urKKfPr57ZvBk71RLBejeje2E-ccnivnmgPlQ
          DRY_RUN: ${{ inputs.dry_run || vars.DRY_RUN || '1' }}
          PLAN_OY: ${{ inputs.plan_oy }}
